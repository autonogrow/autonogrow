services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: autonogrow
      POSTGRES_USER: autonogrow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autonogrow-dev-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autonogrow -d autonogrow"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - autonogrow-postgresql-data:/var/lib/postgresql/data

volumes:
  autonogrow-postgresql-data:
