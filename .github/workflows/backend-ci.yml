name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install locked development dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Critical browser journeys
        run: python scripts/run_e2e.py -q

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      PYTHONPATH: backend
      DATABASE_URL: sqlite:///./autonogrow-ci.db
      DATABASE_MIGRATION_CHECK: "true"
      ENABLE_LEGACY_STARTUP_MIGRATIONS: "false"
      SQLITE_BUSY_TIMEOUT_MS: "5000"
      SQLITE_JOURNAL_MODE: WAL
      SQLITE_SYNCHRONOUS: NORMAL
      SESSION_SECRET: ci-fake-session-secret-32-characters-minimum
      GOOGLE_CLIENT_ID: 1234567890-ci.apps.googleusercontent.com
      OWNER_ALLOWED_EMAILS: owner@autonogrow.test
      FRONTEND_ORIGINS: http://testserver
      WEBHOOK_TEST_SECRET: ci-fake-webhook-secret
      META_APP_ID: ci-fake-meta-app
      META_APP_SECRET: ci-fake-meta-secret
      META_VERIFY_TOKEN: ci-fake-verify-token
      INTEGRATION_ENCRYPTION_KEYS_JSON: '{"v1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
      INTEGRATION_ENCRYPTION_ACTIVE_KEY_VERSION: v1
      INSTAGRAM_PROVIDER_ENABLED: "false"
      INSTAGRAM_REQUIRE_SIGNATURE: "true"
      WEBHOOK_MAX_PAYLOAD_BYTES: "1048576"
      WORKER_ENABLED: "true"
      WORKER_POLL_INTERVAL_SECONDS: "1"
      WORKER_BATCH_SIZE: "10"
      WORKER_LOCK_TIMEOUT_SECONDS: "60"
      WORKER_MAX_ATTEMPTS: "5"
      WORKER_JOB_TIMEOUT_SECONDS: "30"
      WORKER_HEARTBEAT_INTERVAL_SECONDS: "15"
      WORKER_STALE_AFTER_SECONDS: "60"
      PROCESS_WEBHOOK_SYNCHRONOUSLY: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install locked development dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format (incremental scope)
        run: >-
          ruff format --check
          alembic/env.py
          alembic/versions/20260730_02_add_message_timeline_index.py
          alembic/versions/20260730_03_add_persistent_channel_queues.py
          backend/app/core/config.py
          backend/app/core/database.py
          backend/app/core/migration_state.py
          backend/app/models/registry.py
          backend/app/models/channel_queue.py
          backend/app/services/queue_error_service.py
          backend/app/services/inbox_queue_service.py
          backend/app/services/outbox_queue_service.py
          backend/app/services/worker_heartbeat_service.py
          backend/app/services/instagram_inbox_processor.py
          backend/app/workers/channel_worker.py
          backend/tests/test_database_infrastructure.py
          scripts/check_database_migration_state.py
          scripts/manage_migrations.py
          scripts/test_migration_on_copy.py
          scripts/cleanup_queue_history.py

      - name: Incremental mypy
        run: mypy

      - name: Bandit medium and higher
        run: bandit -c pyproject.toml -r backend/app scripts --severity-level medium

      - name: Audit locked production dependencies
        run: pip-audit -r backend/requirements.txt

      - name: Tests and coverage
        run: >-
          pytest
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=60

      - name: Migrate an empty SQLite database
        run: alembic upgrade head

      - name: Confirm Alembic current and head
        run: |
          alembic current
          alembic heads
          python scripts/manage_migrations.py validate

      - name: Confirm persistent queue tables
        run: python -c "from sqlalchemy import create_engine,inspect; from app.core.config import get_database_url; assert {'webhook_inbox_events','channel_outbox_messages','worker_heartbeats'} <= set(inspect(create_engine(get_database_url())).get_table_names())"

      - name: Operational layer dry-runs and static contracts
        run: |
          python scripts/backup_postgresql.py --output-dir "${RUNNER_TEMP}/backups" --json
          python scripts/backup_uploads.py --uploads-dir backend/uploads --output-dir "${RUNNER_TEMP}/backups" --json
          python scripts/prune_backups.py --backup-dir "${RUNNER_TEMP}/backups" --json
          python scripts/deploy_release.py --release ci --environment staging --json
          python scripts/rollback_release.py --target-release previous --environment staging --json
          python -c "from scripts.run_operational_checks import main; assert main(['--dry-run','--no-notify','--json']) in (0,1,2)"
          python -c "from scripts.release_readiness import main; assert main(['--json']) in (0,1,2)"
          python scripts/check_secret_rotation_readiness.py --help
          python scripts/test_postgresql_restore.py --help
          python scripts/predeploy_check.py

  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: autonogrow_test
          POSTGRES_USER: autonogrow
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autonogrow -d autonogrow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      PYTHONPATH: backend
      DATABASE_URL: postgresql+psycopg://autonogrow:ci-only-password@127.0.0.1:5432/autonogrow_test
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://autonogrow:ci-only-password@127.0.0.1:5432/autonogrow_test
      DATABASE_APPLICATION_NAME: autonogrow-ci
      WORKER_CONCURRENCY_MODE: multi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install locked development dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Migrate PostgreSQL to head
        run: alembic upgrade head

      - name: Validate PostgreSQL downgrade and upgrade
        run: |
          alembic current
          alembic downgrade 20260730_03
          alembic upgrade head
          python scripts/manage_migrations.py validate

      - name: PostgreSQL concurrency and migration tests
        run: pytest -m postgresql
