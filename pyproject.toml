mypy_path = "backend"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = ["--strict-markers"]
markers = [
  "postgresql: tests that require an isolated PostgreSQL database at head",
  "e2e: browser journeys that require the isolated Playwright harness",
]

[tool.coverage.run]
source = ["backend/app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["backend/tests"]
