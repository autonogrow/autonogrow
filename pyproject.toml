[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "scripts", "alembic"]
include = ["backend/**/*.py", "scripts/**/*.py", "alembic/**/*.py"]
extend-exclude = [
  # Historical autogenerated DDL is immutable and intentionally not reformatted.
  "alembic/versions/20260730_01_baseline_current_schema.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C90"]

[tool.ruff.lint.per-file-ignores]
# These two pre-existing transition functions are intentionally decomposed in a later sprint.
"backend/app/core/config.py" = ["C901"]
"backend/app/core/database.py" = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = [
  "backend/app/core/config.py",
  "backend/app/core/database.py",
  "backend/app/core/migration_state.py",
  "backend/app/services/integration_crypto_service.py",
  "backend/app/services/instagram_integration_service.py",
  "backend/app/services/automation_credit_service.py",
  "backend/app/services/instagram_provider.py",
  "backend/app/services/instagram_login_provider.py",
  "backend/app/services/instagram_oauth_service.py",
  "backend/app/routers/instagram_oauth.py",
  "backend/app/models/instagram_oauth_attempt.py",
  "backend/app/services/channel_provider_contracts.py",
  "backend/app/services/channel_provider_service.py",
  "backend/app/services/whatsapp_provider.py",
  "backend/app/services/whatsapp_inbox_processor.py",
  "backend/app/services/queue_error_service.py",
  "backend/app/services/inbox_queue_service.py",
  "backend/app/services/outbox_queue_service.py",
  "backend/app/services/worker_heartbeat_service.py",
  "backend/app/services/instagram_inbox_processor.py",
  "backend/app/workers/channel_worker.py",
]
mypy_path = "backend"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = ["--strict-markers"]
markers = [
  "postgresql: tests that require an isolated PostgreSQL database at head",
]

[tool.coverage.run]
source = ["backend/app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["backend/tests"]
