[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "scripts", "alembic", "e2e"]
include = ["backend/**/*.py", "scripts/**/*.py", "alembic/**/*.py", "e2e/**/*.py"]
extend-exclude = [
  # Historical autogenerated DDL is immutable and intentionally not reformatted.
  "alembic/versions/20260730_01_baseline_current_schema.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C90"]

[tool.ruff.lint.per-file-ignores]
# These two pre-existing transition functions are intentionally decomposed in a later sprint.
"backend/app/core/config.py" = ["C901"]
"backend/app/core/database.py" = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = [
