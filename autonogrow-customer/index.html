<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis citas | AutonoGrow</title>
  <link rel="stylesheet" href="../autonogrow-shared/auth.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section id="customer-auth-gate" class="auth-gate" hidden>
    <h1>Accede para ver tus citas</h1>
    <p>Consulta tus próximas citas y tu historial desde una cuenta segura.</p>
    <div id="customer-google-button" class="auth-google-button"></div>
  </section>

  <main id="customer-app" class="customer-page" hidden>
    <header class="customer-header">
      <div><p class="eyebrow">Portal del cliente</p><h1>Mis citas</h1><p id="customer-identity"></p></div>
      <button id="customer-logout" type="button">Salir</button>
    </header>

    <section class="profile-card">
      <h2>Mi perfil</h2>
      <div class="profile-grid">
        <label>Nombre preferido<input id="customer-preferred-name" maxlength="200" /></label>
        <label>Teléfono<input id="customer-phone" maxlength="40" /></label>
      </div>
      <button id="save-customer-profile" type="button">Guardar perfil</button>
      <p id="customer-profile-status" aria-live="polite"></p>
    </section>

    <section><h2>Próximas citas</h2><div id="upcoming-bookings" class="booking-grid"></div></section>
    <section><h2>Historial</h2><div id="past-bookings" class="booking-grid"></div></section>
  </main>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="../autonogrow-shared/auth.js"></script>
  <script src="customer.js"></script>
</body>
</html>
